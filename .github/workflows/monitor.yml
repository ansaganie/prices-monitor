name: Monitor parking listings

on:
  schedule:
    # Runs every 30 minutes. Shifted off the hour (:17, :47) because :00 and :30
    # suffer heavy queue congestion on GitHub Actions runners, causing delayed or dropped runs.
    - cron: "17,47 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [run-monitor, schedule]
  push:
    branches:
      - main
    paths:
      - ".github/workflows/monitor.yml"

# Needed to commit data/state.json back — that file is the entire persistence layer.
permissions:
  contents: write

# Never let two runs race on the same state commit.
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Check listings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bun run src/check.js

      - name: Commit state
        # Runs even when the check step failed, so a partial run still records
        # what it learned (e.g. an object marked failing, to avoid re-alerting).
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "State unchanged — nothing to commit."
          else
            git commit -m "chore: update monitor state [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
