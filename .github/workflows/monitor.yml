name: Monitor parking listings

on:
  schedule:
    # Runs every 30 minutes during Astana working hours (06:00 - 20:00 UTC+05:00 -> 01:00 - 15:00 UTC).
    # Shifted off the hour (:17, :47) because :00 and :30
    # suffer heavy queue congestion on GitHub Actions runners, causing delayed or dropped runs.
    #
    # This account's schedule triggers are unreliable well beyond that congestion note —
    # observed as low as 3 of the ~28 expected daily runs actually firing, consistent with
    # GitHub throttling `schedule:` events for new/low-trust accounts. `external-cron`
    # below (an external service dispatching via the API) is the actual guarantee
    # mechanism; this cron stays wired up only as free supplementary redundancy.
    - cron: "17,47 1-14 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside Astana working hours (06:00 - 20:00 UTC+5)"
        type: boolean
        default: true
  repository_dispatch:
    types: [run-monitor, schedule, external-cron]
  push:
    branches:
      - main
    paths:
      - ".github/workflows/monitor.yml"

# Needed to commit data/state.json back — that file is the entire persistence layer.
permissions:
  contents: write

# Never let two runs race on the same state commit.
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Check listings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force || github.event_name == 'repository_dispatch' && '1' || '' }}
        run: bun run src/check.js

      - name: Commit state
        # Runs even when the check step failed, so a partial run still records
        # what it learned (e.g. an object marked failing, to avoid re-alerting).
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "State unchanged — nothing to commit."
          else
            git commit -m "chore: update monitor state [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
