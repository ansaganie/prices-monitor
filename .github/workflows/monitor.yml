name: Monitor parking listings

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside Astana working hours (06:00 - 20:00 UTC+5)"
        type: boolean
        default: true
  repository_dispatch:
    # cron-job.org is the sole automated trigger — see README's "Guaranteeing >=1 run
    # per working-hour". GitHub's native `schedule:` cron was removed: it was throttled
    # to as low as 3 of the ~28 expected daily runs for this account, and running both
    # made cadence/debugging unpredictable once cron-job.org proved reliable on its own.
    types: [external-cron]
  push:
    branches:
      - main
    paths:
      - ".github/workflows/monitor.yml"

# Needed to read/write the "monitor-state" release that holds run state — see
# docs/adr/0001-release-body-for-state-persistence.md. Releases are covered by
# the same contents:write permission as commits, so no new secret is needed.
permissions:
  contents: write

# Never let two runs race on the same state release.
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Check listings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force || github.event_name == 'repository_dispatch' && '1' || '' }}
        run: bun run src/check.js
